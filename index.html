<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cause or Correlation? Teach the AI!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFDF7; --ink:#2D3748; --muted:#6B7280; --card:#FFFFFF;
    --green:#2E7D5B; --green-soft:#E3F4EB; --green-ink:#1F5A41;
    --orange:#E07A1F; --orange-soft:#FDF0E3; --orange-ink:#9A3412;
    --grey:#8A8F98; --grey-soft:#F1F2F4;
    --purple:#7C3AED; --purple-soft:#F1EAFE;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 20px 40px}
  header h1{font-size:clamp(28px,4vw,42px);font-weight:900;margin:0 0 6px;letter-spacing:-.5px}
  header h1 .c{color:var(--green)} header h1 .k{color:var(--orange)}
  header p{margin:0;max-width:820px;color:#4A5568;font-size:17px}

  .controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:20px 0 18px}
  .controls .lbl{font-weight:800;font-size:15px;margin-right:4px}
  .people{display:flex;gap:8px;flex-wrap:wrap}
  .person{display:flex;align-items:center;gap:8px;border:2px solid #E5E7EB;background:#fff;border-radius:999px;padding:4px 14px 4px 4px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
  .person svg,.person img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 30%}
  .person[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-soft)}
  .person:hover{border-color:#C4B5FD}
  .toggle{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;user-select:none}
  .toggle input{width:20px;height:20px;accent-color:var(--purple)}
  .btn{font:inherit;font-weight:800;border:none;border-radius:12px;padding:10px 18px;cursor:pointer}
  .btn.primary{background:var(--purple);color:#fff}
  .btn.primary:hover{background:#6D28D9}
  .btn.ghost{background:#fff;border:2px solid #E5E7EB;color:var(--ink)}
  .btn.ghost:hover{border-color:#9CA3AF}

  .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:980px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 24px rgba(45,55,72,.07);padding:18px}
  .card h2{margin:0 0 4px;font-size:20px;font-weight:900}
  .card .sub{margin:0 0 8px;color:var(--muted);font-size:14px}

  /* Graph */
  #graph{width:100%;height:auto;display:block}
  .node{cursor:pointer;outline:none}
  .node .box{transition:stroke .2s, stroke-width .2s, filter .2s}
  .node:hover .box,.node:focus-visible .box{filter:drop-shadow(0 0 6px rgba(124,58,237,.45))}
  .node .lab{font-weight:800;font-size:20px;pointer-events:none}
  .node .val{font-size:14.5px;font-weight:700;pointer-events:none}
  .node.intervened .box{stroke:var(--purple)!important;stroke-width:4.5!important;stroke-dasharray:none!important}
  .node.changed .box{animation:pulse 1.4s ease-in-out 3}
  .node.changed .val{text-decoration:underline;text-decoration-thickness:2px}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(52,211,153,0))}50%{filter:drop-shadow(0 0 10px rgba(52,211,153,.95))}}
  .badge{display:none}
  .node.intervened .badge{display:inline}
  .edge{transition:opacity .3s}
  .edge.cut{opacity:.18;stroke-dasharray:6 6}
  .cutmark{display:none;font-size:20px}
  .cutmark.on{display:inline}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:#4A5568;margin-top:6px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{display:inline-block;width:26px;height:0;border-top:3px solid var(--green)}
  .sw.d{border-top:3px dashed var(--orange)}
  .sw.p{width:18px;height:14px;border:3px solid var(--purple);border-radius:6px}

  /* Faces */
  .faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  figure{margin:0;border-radius:16px;padding:10px;background:#FAFAFB;border:2px solid #EEF0F3;display:flex;flex-direction:column;gap:8px}
  figure.reg{border-color:#F6D3B2;background:#FFF9F3}
  figure.cau{border-color:#BFE6D1;background:#F5FBF8}
  figcaption{font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px}
  figcaption small{font-weight:700;color:var(--muted);font-size:12px;display:block}
  .img{aspect-ratio:200/220;width:100%;border-radius:14px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
  .img svg,.img img{width:100%;height:100%;display:block;object-fit:cover}
  .img.wait{border:2px dashed #D1D5DB;background:#fff;color:#9CA3AF;font-size:48px;font-weight:900}
  .img.wait.small{font-size:13px;font-weight:700;padding:10px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
  .chip{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .chip.good{background:var(--green-soft);color:var(--green-ink)}
  .chip.bad{background:#FFE4D1;color:var(--orange-ink)}
  .chip.hid{background:var(--grey-soft);color:#4A5568}
  .chip.none{background:#F3F4F6;color:#6B7280}

  /* Panel */
  #panel:empty{display:none}
  #panel{margin-top:14px;border-radius:16px;background:var(--purple-soft);padding:16px 18px}
  #panel h3{margin:0 0 6px;font-size:19px;font-weight:900}
  #panel p{margin:6px 0}
  #panel ol{margin:6px 0 0;padding-left:22px}
  .do{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:2px solid var(--purple);color:var(--purple);border-radius:8px;padding:1px 7px;font-weight:700;white-space:nowrap}
  .guesses{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
  .guess{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #DDD6FE;border-radius:12px;padding:6px 12px;font-weight:800;cursor:pointer}
  .guess input{width:18px;height:18px;accent-color:var(--purple)}
  .guess.fixed{opacity:.6;cursor:default}
  .score{font-weight:900;font-size:17px}
  .note{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
  .note.o{border-left:5px solid var(--orange)}
  .note.g{border-left:5px solid var(--green)}
  .note.p{border-left:5px solid var(--purple)}
  footer{margin-top:22px;color:var(--muted);font-size:13px;text-align:center;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
  footer .logo{justify-self:start;display:block;line-height:0}
  footer .logo img{height:56px;width:auto}
  @media (max-width:640px){footer{grid-template-columns:1fr} footer .logo{justify-self:center}}
</style>
<style>
  /* Story additions */
  .topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .steps{display:flex;gap:8px;flex-wrap:wrap}
  .step{font:inherit;font-weight:800;font-size:14px;border:2px solid #E5E7EB;background:#fff;color:#6B7280;border-radius:999px;padding:6px 14px;cursor:pointer}
  .step .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#E5E7EB;color:#4B5563;align-items:center;justify-content:center;margin-right:6px;font-size:12.5px}
  .step.on{border-color:var(--purple);color:var(--purple);background:var(--purple-soft)}
  .step.on .n{background:var(--purple);color:#fff}
  .step.done .n{background:var(--green);color:#fff}
  .hide{display:none!important}
  .r1{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;min-height:420px}
  .r1 h2{font-size:28px}
  .r1 p{margin:0;font-size:19px;color:#4A5568;max-width:420px}
  .btn.big{font-size:24px;padding:16px 30px;border-radius:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 6px 18px rgba(124,58,237,.3)}
  .btn.big[disabled]{opacity:.55;cursor:default;box-shadow:none}
  .edge,.imgedge,.elabel{transition:opacity .6s}
  .gone{opacity:0}
  #graph.inactive .node{cursor:default}
  #graph.inactive .node:hover .box{filter:none}
  .arrows{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .arrowbtn{font:inherit;font-weight:800;font-size:14.5px;border:2px dashed #C4B5FD;background:#fff;color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer}
  .arrowbtn:hover{border-color:var(--purple)}
  .arrowbtn.yes{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
  .arrowbtn.no{border-style:solid;border-color:#F87171;background:#FEE2E2;color:#991B1B;text-decoration:line-through;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .arrowtools{display:flex;gap:8px;margin-top:10px}
  .btn.sm{font-size:13.5px;padding:7px 12px}
  .navbar{display:flex;justify-content:space-between;margin-top:18px}
  .pred-row{margin:10px 0 4px;font-weight:900}
  .result-line{margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 style="font-size:clamp(28px,4vw,42px);font-weight:900;margin:0;letter-spacing:-.5px"><span style="color:var(--green)">Cause</span> or <span style="color:var(--orange)">correlation?</span></h1>
    <nav class="steps" id="steps">
      <button class="step" data-s="1"><span class="n">1</span>Round 1</button>
      <button class="step" data-s="2"><span class="n">2</span>Build the graph</button>
      <button class="step" data-s="3"><span class="n">3</span>Round 2</button>
    </nav>
  </div>

  <div class="controls" id="controls">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="lbl">Pick a person:</span>
      <div class="people" id="people"></div>
    </div>
    <label class="toggle"><input type="checkbox" id="predictToggle" checked> Predict first</label>
    <button class="btn ghost" id="resetBtn">↺ Reset</button>
  </div>

  <div class="grid">
    <section class="card">
      <!-- Round 1 -->
      <div class="r1" id="r1">
        <h2>Round 1</h2>
        <p id="r1q"></p>
        <button class="btn primary big" id="doAgeBtn">do(Age = old)</button>
        <button class="btn ghost hide" id="whatBtn" style="font-size:18px;padding:12px 22px">🔍 What changed?</button>
      </div>
      <!-- Graph (rounds 2 & 3) -->
      <div id="graphBox">
        <h2>The causal graph</h2>
        <p class="sub" id="graphSub"></p>
        <svg id="graph" viewBox="90 28 880 522" role="group" aria-label="Causal graph"></svg>
        <div class="legend" id="legend">
          <span><i class="sw"></i> causes</span>
          <span><i class="sw p"></i> your intervention do( )</span>
        </div>
        <div id="arrowArea">
          <div class="arrows" id="arrowBtns"></div>
          <div class="arrowtools">
            <button class="btn ghost sm" id="allArrows">Show all arrows</button>
            <button class="btn ghost sm" id="noArrows">Clear arrows</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="faces">
        <figure id="figOrig"><figcaption>📷 Original</figcaption><div class="img" id="imgOrig"></div><div class="chips" id="chipsOrig"></div></figure>
        <figure class="reg" id="figReg"><figcaption>🤖 Regular AI</figcaption><div class="img wait" id="imgReg">?</div><div class="chips" id="chipsReg"></div></figure>
        <figure class="cau" id="figCau"><figcaption>🧠 Causal AI</figcaption><div class="img wait" id="imgCau">?</div><div class="chips" id="chipsCau"></div></figure>
      </div>
      <div id="panel" aria-live="polite"></div>
    </section>
  </div>

  <div class="navbar">
    <button class="btn ghost" id="backBtn">← Back</button>
    <button class="btn primary" id="nextBtn">Next →</button>
  </div>

  <footer>
    <a class="logo" href="https://www.chai.ac.uk" target="_blank" rel="noopener" title="CHAI Hub: Causality in Healthcare AI"><img src="chai_logo.png" alt="CHAI Hub logo"></a>
    <span>A counterfactual image demo · all portraits are AI-generated counterfactuals, not real photos</span>
    <span aria-hidden="true"></span>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   REAL IMAGES
   The "images/" folder next to this page holds one portrait per person
   and attribute combination (16 per person), named:
     images/<person>_grey<0|1>_wrinkles<0|1>_glasses<0|1>_style<0|1>.png
   e.g. images/olivia_grey1_wrinkles1_glasses0_style0.png
   Set USE_REAL_IMAGES = false to go back to the toy drawings.
------------------------------------------------------------------- */
const USE_REAL_IMAGES = true;
const imagePath = (pid, s) =>
  `images/${pid}_grey${s.grey}_wrinkles${s.wrinkles}_glasses${s.glasses}_style${s.style}.png`;

/* Each person's starting point. age: 0 young / 1 old. eyesight: 0 good / 1 poor
   (poor = starts with glasses). era: 0 today / 1 long ago (= starts with cap & jacket). */
const PEOPLE = {
  olivia: {name:'Olivia Rodrigo',     short:'Olivia', age:0, eyesight:0, era:0},
  tom:    {name:'Tom Holland',        short:'Tom',    age:0, eyesight:0, era:0},
  david:  {name:'David Attenborough', short:'David',  age:1, eyesight:0, era:0},
  morgan: {name:'Morgan Freeman',     short:'Morgan', age:1, eyesight:0, era:0},
};
const DEFAULT_PERSON = Object.keys(PEOPLE)[0];
const NODE = {
  age:      {label:'Age',         vals:['young','old']},
  eyesight: {label:'Eyesight',    vals:['good','poor']},
  era:      {label:'Fashion era', vals:['today','long ago']},
  grey:     {label:'Grey hair',   vals:['no','yes']},
  wrinkles: {label:'Wrinkles',    vals:['no','yes']},
  glasses:  {label:'Eyeglasses',  vals:['no','yes']},
  style:    {label:'Style',       vals:['t-shirt','cap & jacket']},
};
const FEATURES = ['grey','wrinkles','glasses','style'];
const INCOMING = {grey:'e-age-grey', wrinkles:'e-age-wr', glasses:'e-eye-gl', style:'e-era-st'};

/* Arrows the class can add in "Build the graph". Decoys are arrows that do NOT belong. */
const ARROWS = [
  {id:'e-age-grey', from:'Age',         to:'Grey hair'},
  {id:'e-age-wr',   from:'Age',         to:'Wrinkles'},
  {id:'x-age-gl',   from:'Age',         to:'Eyeglasses', decoy:true},
  {id:'x-age-st',   from:'Age',         to:'Style',      decoy:true},
  {id:'e-eye-gl',   from:'Eyesight',    to:'Eyeglasses'},
  {id:'e-era-st',   from:'Fashion era', to:'Style'},
  {id:'img',        from:'Everything',  to:'Image'},
];

function causalWorld(roots, doVar, val){
  const r = {...roots};
  if (doVar && doVar in r) r[doVar] = val;
  const s = {...r, grey:r.age, wrinkles:r.age, glasses:r.eyesight, style:r.era};
  if (FEATURES.includes(doVar)) s[doVar] = val;
  return s;
}
function regularWorld(fact, doVar, val){
  const s = {...fact};
  ['age', ...FEATURES].forEach(k => s[k] = val);
  if (doVar === 'eyesight' || doVar === 'era') s[doVar] = val;
  return s;
}
const changed = (a,b) => FEATURES.filter(k => a[k] !== b[k]);

/* ---------- Toy face ---------- */
function faceSVG(s){
  const hair = s.grey ? '#C9CDD5' : '#6B4226';
  const brow = s.grey ? '#9AA0AA' : '#4A2E1A';
  const skin = '#F5C9A2', line = '#B9825F';
  let o = `<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${describe(s)}">`;
  o += `<rect width="200" height="220" fill="#EAF4FB"/>`;
  o += `<path d="M26,220 C28,172 62,152 100,152 C138,152 172,172 174,220 Z" fill="${s.style ? '#8C4A3A' : '#3B82C4'}"/>`;
  o += `<rect x="88" y="124" width="24" height="34" rx="8" fill="${skin}"/>`;
  if (s.style){
    o += `<path d="M84,153 L100,194 L116,153 Z" fill="#F3E9D2"/>`;
    o += `<circle cx="100" cy="202" r="3.2" fill="#E8D3A0"/><circle cx="100" cy="213" r="3.2" fill="#E8D3A0"/>`;
    o += `<path d="M84,153 L100,194 M116,153 L100,194" stroke="#6E382C" stroke-width="3"/>`;
  } else {
    o += `<path d="M62,158 Q100,194 138,158" stroke="#2F6FA8" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    o += `<line x1="91" y1="174" x2="89" y2="198" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>`;
    o += `<line x1="109" y1="174" x2="111" y2="198" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>`;
  }
  o += `<circle cx="53" cy="100" r="10" fill="${skin}"/><circle cx="147" cy="100" r="10" fill="${skin}"/>`;
  o += `<ellipse cx="100" cy="95" rx="48" ry="54" fill="${skin}"/>`;
  o += `<path d="M51,96 C46,44 78,30 100,30 C124,30 156,44 149,96 C144,72 128,60 100,62 C74,60 57,72 51,96 Z" fill="${hair}"/>`;
  if (s.wrinkles){
    o += `<path d="M84,73 Q100,69 116,73 M88,79 Q100,76 112,79" stroke="${line}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    o += `<path d="M64,95 L57,92 M64,101 L57,104 M136,95 L143,92 M136,101 L143,104" stroke="${line}" stroke-width="1.8" stroke-linecap="round"/>`;
    o += `<path d="M77,112 Q79,124 85,130 M123,112 Q121,124 115,130" stroke="${line}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  }
  o += `<path d="M72,87 Q82,82 92,86 M108,86 Q118,82 128,87" stroke="${brow}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  o += `<circle cx="82" cy="99" r="4.6" fill="#2D3748"/><circle cx="118" cy="99" r="4.6" fill="#2D3748"/>`;
  o += `<circle cx="72" cy="115" r="7" fill="#F29E8E" opacity=".35"/><circle cx="128" cy="115" r="7" fill="#F29E8E" opacity=".35"/>`;
  o += `<path d="M100,103 Q95,114 102,116" stroke="${line}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  o += `<path d="M86,124 Q100,135 114,124" stroke="#9B4A3C" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (s.glasses){
    o += `<g stroke="#1F2937" stroke-width="3" fill="rgba(255,255,255,.18)"><circle cx="82" cy="99" r="14"/><circle cx="118" cy="99" r="14"/></g>`;
    o += `<path d="M96,98 Q100,95 104,98 M68,97 L54,95 M132,97 L146,95" stroke="#1F2937" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  if (s.style){
    o += `<path d="M54,66 C54,38 78,26 100,26 C124,26 148,38 148,62 Z" fill="#7A6650"/>`;
    o += `<path d="M50,66 Q62,55 100,55 Q140,55 160,62 Q142,72 100,70 Q66,70 50,66 Z" fill="#5E4E3D"/>`;
    o += `<path d="M70,44 Q100,36 132,44" stroke="#8E7860" stroke-width="2" fill="none"/>`;
  }
  return o + `</svg>`;
}
function describe(s){
  return `Face with ${s.grey?'grey':'brown'} hair, ${s.wrinkles?'wrinkles':'no wrinkles'}, ${s.glasses?'glasses':'no glasses'}, wearing ${s.style?'a cap and jacket':'a t-shirt'}`;
}
function paintImage(el, pid, s){
  el.className = 'img';
  el.innerHTML = USE_REAL_IMAGES ? `<img src="${imagePath(pid,s)}" alt="${describe(s)}">` : faceSVG(s);
}
const avatar = (pid, s) => USE_REAL_IMAGES ? `<img src="${imagePath(pid,s)}" alt="">` : faceSVG(s);
/* Load a person's 16 portraits ahead of time so reveals do not flicker. */
function preload(pid){
  if (!USE_REAL_IMAGES) return;
  for (let i = 0; i < 16; i++)
    new Image().src = imagePath(pid, {grey:i&1, wrinkles:i>>1&1, glasses:i>>2&1, style:i>>3&1});
}



/* ---------- Graph ---------- */
const GEO = {
  age:      {x:250, y:62,  w:160, h:58, kind:'cause'},
  eyesight: {x:590, y:64,  w:140, h:54, kind:'hidden'},
  era:      {x:775, y:64,  w:170, h:54, kind:'hidden'},
  grey:     {x:115, y:262, w:150, h:58, kind:'effect'},
  wrinkles: {x:305, y:262, w:150, h:58, kind:'effect'},
  glasses:  {x:585, y:262, w:150, h:58, kind:'corr'},
  style:    {x:785, y:262, w:150, h:58, kind:'corr'},
};
const KIND = {
  cause:  {fill:'#2E7D5B', stroke:'#2E7D5B', dash:'',    lab:'#FFFFFF', val:'#D7F0E3', rx:29},
  hidden: {fill:'#F1F2F4', stroke:'#8A8F98', dash:'5 4', lab:'#4A5568', val:'#6B7280', rx:27},
  effect: {fill:'#E3F4EB', stroke:'#2E7D5B', dash:'',    lab:'#1F5A41', val:'#2E7D5B', rx:14},
  corr:   {fill:'#FDF0E3', stroke:'#E07A1F', dash:'',    lab:'#9A3412', val:'#C2410C', rx:14},
};
function buildGraph(){
  const g = document.getElementById('graph');
  let o = `<defs>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D5B"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/></marker>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker>
  </defs>`;
  o += `<line class="edge" id="e-age-grey" x1="310" y1="120" x2="205" y2="257" stroke="#2E7D5B" stroke-width="3.5" marker-end="url(#aC)"/>`;
  o += `<line class="edge" id="e-age-wr"   x1="345" y1="120" x2="375" y2="257" stroke="#2E7D5B" stroke-width="3.5" marker-end="url(#aC)"/>`;
  o += `<text class="elabel" id="l-e-age-grey" x="248" y="176" font-size="15" fill="#2E7D5B" font-weight="800" text-anchor="end">causes</text>`;
  o += `<text class="elabel" id="l-e-age-wr" x="372" y="190" font-size="15" fill="#2E7D5B" font-weight="800">causes</text>`;
  o += `<line class="edge" id="e-eye-gl" x1="660" y1="118" x2="660" y2="257" stroke="#8A8F98" stroke-width="2.8" marker-end="url(#aO)"/>`;
  o += `<line class="edge" id="e-era-st" x1="860" y1="118" x2="860" y2="257" stroke="#8A8F98" stroke-width="2.8" marker-end="url(#aO)"/>`;
  const mids = {'e-age-grey':[257,188], 'e-age-wr':[360,188], 'e-eye-gl':[660,188], 'e-era-st':[860,188]};
  for (const [id,[x,y]] of Object.entries(mids))
    o += `<text class="cutmark" id="cut-${id}" x="${x}" y="${y+7}" text-anchor="middle">✂️</text>`;
  o += `<g class="imgedge" id="img">
    <line x1="190" y1="320" x2="438" y2="440" stroke="#4A5568" stroke-width="2.5" marker-end="url(#aI)"/>
    <line x1="380" y1="320" x2="490" y2="428" stroke="#4A5568" stroke-width="2.5" marker-end="url(#aI)"/>
    <line x1="660" y1="320" x2="560" y2="428" stroke="#4A5568" stroke-width="2.5" marker-end="url(#aI)"/>
    <line x1="860" y1="320" x2="612" y2="440" stroke="#4A5568" stroke-width="2.5" marker-end="url(#aI)"/></g>`;
  for (const [id, n] of Object.entries(GEO)){
    const k = KIND[n.kind], cx = n.x + n.w/2, cy = n.y + n.h/2;
    o += `<g class="node" data-node="${id}" tabindex="0" role="button" aria-label="Intervene on ${NODE[id].label}">
      <rect class="box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${k.rx}" fill="${k.fill}" stroke="${k.stroke}" stroke-width="2.5" ${k.dash?`stroke-dasharray="${k.dash}"`:''}/>
      <text class="lab" x="${cx}" y="${cy-2}" text-anchor="middle" fill="${k.lab}">${NODE[id].label}</text>
      <text class="val" id="v-${id}" x="${cx}" y="${cy+18}" text-anchor="middle" fill="${k.val}"></text>
      <g class="badge"><rect x="${cx-30}" y="${n.y-25}" width="60" height="21" rx="10.5" fill="#7C3AED"/>
      <text x="${cx}" y="${n.y-10}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" font-family="ui-monospace,Menlo,monospace">do( )</text></g>
    </g>`;
  }
  o += `<g class="node" data-node="image" tabindex="0" role="button" aria-label="Image">
    <rect class="box" x="435" y="425" width="180" height="110" rx="16" fill="#fff" stroke="#4A5568" stroke-width="2.5"/>
    <circle cx="525" cy="467" r="27" fill="#FFE2C6" stroke="#4A5568" stroke-width="2"/>
    <circle cx="516" cy="462" r="3" fill="#4A5568"/><circle cx="534" cy="462" r="3" fill="#4A5568"/>
    <path d="M514,474 Q525,483 536,474" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <text class="lab" x="525" y="521" text-anchor="middle" fill="#2D3748">Image</text>
  </g>`;
  g.innerHTML = o;
  g.querySelectorAll('.node').forEach(el => {
    el.addEventListener('click', () => onNode(el.dataset.node));
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); onNode(el.dataset.node);} });
  });
}

/* ---------- State ---------- */
const st = {
  stage:1, person:DEFAULT_PERSON, doVar:null, val:null, phase:'idle', predict:false,
  gReg:new Set(), gCau:new Set(), imageHint:false,
  arrows:new Set(), decoys:new Set(), r1Chips:false,
};
const roots = () => { const p = PEOPLE[st.person]; return {age:p.age, eyesight:p.eyesight, era:p.era}; };

function setIntervention(v, phase){
  const fact = causalWorld(roots());
  st.doVar = v; st.val = 1 - fact[v]; st.gReg = new Set(); st.gCau = new Set();
  st.phase = phase; st.imageHint = false;
}
function goStage(n){
  st.stage = n;
  if (n === 1){ st.r1Chips = false; st.arrows.clear(); st.decoys.clear(); st.gReg = new Set(); st.gCau = new Set(); st.person = DEFAULT_PERSON; st.predict = false; st.doVar = null; st.phase = 'idle'; st.imageHint = false; }
  if (n === 2){ st.person = DEFAULT_PERSON; st.predict = false; setIntervention('age', 'revealed'); }
  if (n === 3){ st.person = DEFAULT_PERSON; st.predict = true; setIntervention('grey', 'predict'); }
  render();
}
function onNode(id){
  if (st.stage !== 3) return;
  if (id === 'image'){ st.doVar = null; st.phase = 'idle'; st.imageHint = true; render(); return; }
  setIntervention(id, st.predict ? 'predict' : 'revealed');
  render();
}
function reset(){ st.doVar = null; st.phase = 'idle'; st.imageHint = false; render(); }

/* ---------- Render ---------- */
const doTag = (v,val) => `<span class="do">do(${NODE[v].label} = ${NODE[v].vals[val]})</span>`;
const chip = (cls, txt) => `<span class="chip ${cls}">${txt}</span>`;
const $ = id => document.getElementById(id);

function renderArrows(){
  $('arrowBtns').innerHTML = ARROWS.map(a => {
    const cls = a.decoy ? (st.decoys.has(a.id) ? 'no' : '') : (st.arrows.has(a.id) ? 'yes' : '');
    const mark = cls === 'yes' ? '✓ ' : cls === 'no' ? '✗ ' : '+ ';
    return `<button class="arrowbtn ${cls}" data-id="${a.id}">${mark}${a.from} → ${a.to}</button>`;
  }).join('');
  $('arrowBtns').querySelectorAll('.arrowbtn').forEach(b => b.onclick = () => {
    const a = ARROWS.find(x => x.id === b.dataset.id);
    const set = a.decoy ? st.decoys : st.arrows;
    set.has(a.id) ? set.delete(a.id) : set.add(a.id);
    render();
  });
}

function render(){
  const S = st.stage, pid = st.person, fact = causalWorld(roots()), p = PEOPLE[pid];

  // steps & nav
  document.querySelectorAll('.step').forEach(b => {
    const n = +b.dataset.s; b.classList.toggle('on', n === S); b.classList.toggle('done', n < S);
  });
  $('backBtn').style.visibility = S === 1 ? 'hidden' : 'visible';
  $('nextBtn').style.visibility = S === 3 ? 'hidden' : 'visible';
  $('nextBtn').textContent = S === 1 ? 'Build the graph →' : 'Round 2 →';

  // sections
  $('controls').classList.toggle('hide', S !== 3);
  $('r1').classList.toggle('hide', S !== 1);
  $('graphBox').classList.toggle('hide', S === 1);
  $('arrowArea').classList.toggle('hide', S !== 2);
  $('graph').classList.toggle('inactive', S !== 3);
  $('graphSub').innerHTML = S === 2
    ? 'Which arrows belong in the graph? Add them one by one.'
    : '👆 Click a node to <b>intervene</b>: set it yourself and see what happens.';
  const ageTo = NODE.age.vals[1 - p.age];
  $('r1q').innerHTML = `What would <b>${p.short}</b> look like if ${p.short} were <b>${ageTo}</b>?`;
  $('doAgeBtn').textContent = `do(Age = ${ageTo})`;
  $('doAgeBtn').disabled = S === 1 && st.phase === 'revealed';
  $('whatBtn').classList.toggle('hide', !(S === 1 && st.phase === 'revealed' && !st.r1Chips));
  if (S === 2) renderArrows();
  document.querySelectorAll('.person').forEach(b => b.setAttribute('aria-pressed', b.dataset.pid === pid));
  $('predictToggle').checked = st.predict;

  // edge visibility
  const show = id => S === 3 || st.arrows.has(id);
  for (const id of ['e-age-grey','e-age-wr','e-eye-gl','e-era-st','img']){
    $(id).classList.toggle('gone', !show(id));
    const l = $('l-'+id); if (l) l.classList.toggle('gone', !show(id));
  }
  $('legend').classList.toggle('hide', S === 2 && st.arrows.size === 0);

  // original
  paintImage($('imgOrig'), pid, fact);
  $('chipsOrig').innerHTML = chip('hid', p.name) + chip('hid', NODE.age.vals[p.age]) +
    chip('hid', `eyesight: ${NODE.eyesight.vals[p.eyesight]}`) + chip('hid', `era: ${NODE.era.vals[p.era]}`);

  let cs = null, rs = null, cChg = [], rChg = [];
  if (st.doVar){
    cs = causalWorld(roots(), st.doVar, st.val);
    rs = regularWorld(fact, st.doVar, st.val);
    cChg = changed(fact, cs); rChg = changed(fact, rs);
  }
  const revealed = st.phase === 'revealed';

  // graph values & classes
  for (const id of Object.keys(GEO)){
    const el = document.querySelector(`.node[data-node="${id}"]`);
    const shown = revealed ? cs : fact;
    let txt = NODE[id].vals[shown[id]];
    if (id === st.doVar) txt = `set to: ${NODE[id].vals[st.val]}`;
    $('v-'+id).textContent = txt;
    el.classList.toggle('intervened', id === st.doVar);
    el.classList.remove('changed');
    if (revealed && id !== st.doVar && cChg.includes(id)){ void el.getBBox(); el.classList.add('changed'); }
  }
  for (const [node, eid] of Object.entries(INCOMING)){
    const cut = S === 3 && st.doVar === node;
    $(eid).classList.toggle('cut', cut);
    $('cut-'+eid).classList.toggle('on', cut);
  }

  // result images
  const imgReg = $('imgReg'), imgCau = $('imgCau');
  if (revealed){
    paintImage(imgReg, pid, rs); paintImage(imgCau, pid, cs);
    if (S === 1 && !st.r1Chips){ $('chipsReg').innerHTML = $('chipsCau').innerHTML = ''; }
    else {
    $('chipsReg').innerHTML = rChg.length
      ? rChg.map(k => cChg.includes(k) ? chip('good', '✓ '+NODE[k].label.toLowerCase()) : chip('bad', '✗ '+NODE[k].label.toLowerCase())).join('')
      : chip('none','nothing changed');
    $('chipsCau').innerHTML = cChg.length ? cChg.map(k => chip('good', '✓ '+NODE[k].label.toLowerCase())).join('') : chip('none','nothing changed');
    }
  } else {
    for (const el of [imgReg, imgCau]){
      el.className = st.doVar ? 'img wait' : 'img wait small';
      el.innerHTML = st.doVar ? '?' : (S === 1 ? `Press do(Age = ${ageTo})` : 'Click a node in the graph');
    }
    $('chipsReg').innerHTML = $('chipsCau').innerHTML = '';
  }

  // panel (round 2 only)
  const panel = $('panel');
  if (S !== 3){ panel.innerHTML = ''; return; }
  if (st.imageHint){
    panel.innerHTML = `<h3>🖼️ That's the image!</h3><p>The image is the <b>result</b> of everything above it, so you can't set it directly.</p>`;
  } else if (!st.doVar){
    panel.innerHTML = '';
  } else if (st.phase === 'predict'){
    const row = (who, set) => FEATURES.map(k => k === st.doVar
      ? `<label class="guess fixed"><input type="checkbox" checked disabled> ${NODE[k].label} <small>(you set it)</small></label>`
      : `<label class="guess"><input type="checkbox" data-who="${who}" data-k="${k}" ${set.has(k)?'checked':''}> ${NODE[k].label}</label>`).join('')
      + `<label class="guess"><input type="checkbox" data-who="${who}" data-k="none" ${set.has('none')?'checked':''}> Nothing else</label>`;
    panel.innerHTML = `<h3>${doTag(st.doVar, st.val)}</h3>
      <p>${p.name}: what will the causal AI change?</p>
      <div class="pred-row">🧠 Causal AI</div><div class="guesses">${row('cau', st.gCau)}</div>
      <button class="btn primary" id="revealBtn">Reveal ✨</button>`;
    panel.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('change', () => {
      const set = i.dataset.who === 'reg' ? st.gReg : st.gCau;
      i.checked ? set.add(i.dataset.k) : set.delete(i.dataset.k);
      if (i.checked){ // "Nothing" and the other choices exclude each other
        const clear = i.dataset.k === 'none' ? [...set].filter(k => k !== 'none') : ['none'];
        clear.forEach(k => { set.delete(k); const o = panel.querySelector(`input[data-who="${i.dataset.who}"][data-k="${k}"]`); if (o) o.checked = false; });
      }
    }));
    $('revealBtn').onclick = () => { st.phase = 'revealed'; render(); };
  } else {
    let html = `<h3>${doTag(st.doVar, st.val)}</h3>`;
    if (st.predict){
      const score = (icon, name, truthAll, guesses) => {
        const truth = truthAll.filter(k => k !== st.doVar);
        const missed = truth.filter(k => !guesses.has(k));
        const extra = [...guesses].filter(k => k !== 'none' && !truth.includes(k));
        if (!missed.length && !extra.length) return `<p class="result-line">${icon} <b>${name}:</b> 🎉 spot on!</p>`;
        let s = `<p class="result-line">${icon} <b>${name}:</b> almost!`;
        if (missed.length) s += ` It also changed <b>${missed.map(k=>NODE[k].label).join(', ')}</b>.`;
        if (extra.length) s += ` It did not change <b>${extra.map(k=>NODE[k].label).join(', ')}</b>.`;
        return s + `</p>`;
      };
      html += score('🧠', 'Causal AI', cChg, st.gCau);
    }
    panel.innerHTML = html;
  }
}

/* ---------- Init ---------- */
function init(){
  const box = $('people');
  box.innerHTML = Object.entries(PEOPLE).map(([pid, p]) =>
    `<button class="person" data-pid="${pid}" aria-pressed="false">${avatar(pid, causalWorld({age:p.age, eyesight:p.eyesight, era:p.era}))}${p.name}</button>`).join('');
  box.querySelectorAll('.person').forEach(b => b.onclick = () => { st.person = b.dataset.pid; preload(st.person); reset(); });
  preload(DEFAULT_PERSON);
  $('predictToggle').onchange = e => { st.predict = e.target.checked; if (st.phase==='predict') st.phase='revealed'; render(); };
  $('resetBtn').onclick = reset;
  $('doAgeBtn').onclick = () => { setIntervention('age', 'revealed'); render(); };
  $('whatBtn').onclick = () => { st.r1Chips = true; render(); };
  $('allArrows').onclick = () => { ARROWS.filter(a => !a.decoy).forEach(a => st.arrows.add(a.id)); render(); };
  $('noArrows').onclick = () => { st.arrows.clear(); st.decoys.clear(); render(); };
  document.querySelectorAll('.step').forEach(b => b.onclick = () => goStage(+b.dataset.s));
  $('nextBtn').onclick = () => goStage(Math.min(3, st.stage + 1));
  $('backBtn').onclick = () => goStage(Math.max(1, st.stage - 1));
  buildGraph();
  goStage(1);
}
init();
</script>
</body>
</html>
